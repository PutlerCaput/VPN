[project]
name = "node-rental-bot"
version = "1.0.0"
requires-python = ">=3.11,<3.12"

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["pwa", "tma", "data", "logs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["^pwa/", "^tma/", "^tests/"]

[[tool.mypy.overrides]]
module = ["handlers.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests", "pwa", "tma", ".venv", "venv", "data", "logs", "backups"]
