name: Android subscription refresh

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android-subscription.yml"
      - "tests/interop/**"
      - "services/sharding.py"
      - "api/routes.py"

permissions:
  contents: read

jobs:
  android-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Fetch the pinned release APKs
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 120 -o ng.apk \
            https://github.com/2dust/v2rayNG/releases/download/2.3.15/v2rayNG_2.3.15_x86_64.apk
          curl -fsSL --retry 3 --max-time 120 -o nb.apk \
            https://github.com/MatsuriDayo/NekoBoxForAndroid/releases/download/1.4.2/NekoBox-1.4.2-x86_64.apk
          echo '6c5276597d913c1330334b99d03b273201834cf475ab6aa709f7413097613bd5  ng.apk' | sha256sum -c -
          echo 'aa3282a2736334c1cd810e42b36d94769ea1e33d6512a70d0fc90bcea4ef6935  nb.apk' | sha256sum -c -
      - name: Allow the runner to use KVM
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Import and refresh on a temporary Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 360
          script: |
            adb -s emulator-5554 shell svc wifi disable
            adb -s emulator-5554 shell svc data disable
            adb -s emulator-5554 install -g "$RUNNER_TEMP/ng.apk"
            adb -s emulator-5554 install -g "$RUNNER_TEMP/nb.apk"
            pytest -q tests/interop/android_refresh.py --tb=short
