name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: age (the backup tests encrypt and decrypt for real)
        run: |
          # The Ubuntu mirror is sometimes unreachable from the runner. The same
          # version from the project's own release, pinned by checksum, stands in.
          if ! sudo apt-get install -y -q age; then
            curl -fsSL --retry 3 -o /tmp/age.tar.gz \
              https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz
            echo "cf16cbb108fc56e2064b00ba2b65d9fb1b8d7002ca5e38260ee1cc34f6aaa8f9  /tmp/age.tar.gz" \
              | sha256sum -c -
            tar -xzf /tmp/age.tar.gz -C /tmp
            sudo install -m 0755 /tmp/age/age /tmp/age/age-keygen /usr/local/bin/
          fi
          age --version
      - name: Secret scan
        run: ./scripts/secret_scan.sh
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Bandit
        run: bandit -r . -c pyproject.toml -q
      - name: Dependency audit (pip-audit, runtime + dev)
        run: pip-audit -r requirements-dev.txt
      - name: Pytest
        run: pytest -q
      - name: Tests on SQLCipher
        run: TEST_DB_KEY="$(python -c 'print("ab" * 32)')" pytest -q
      - name: Tests through the database gateway (SQLCipher behind it)
        run: TEST_DB_BACKEND=remote TEST_DB_KEY="$(python -c 'print("ab" * 32)')" pytest -q

  frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        app: [pwa, tma]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Forbidden words and unsafe APIs
        # One "if" per check: under "bash -e" a negated "! grep" never stops the
        # script, so only the last line used to decide the result.
        run: |
          if grep -rniE '\bVPN\b|обход|анонимн|proxy' src --include='*.ts' --include='*.tsx'; then exit 1; fi
          if grep -rn 'dangerouslySetInnerHTML' src; then exit 1; fi

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python, frontends]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image
        run: docker build --target bot -t node-rental-bot:ci .
      - name: Build web image
        run: docker build --target web --build-arg VITE_BOT_USERNAME=ci_test_bot -t node-rental-web:ci .
