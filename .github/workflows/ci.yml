name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SECRETS_DIR: /nonexistent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Secret scan
        run: ./scripts/secret_scan.sh
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy .
      - name: Bandit
        run: bandit -r . -c pyproject.toml -q
      - name: Dependency audit (pip-audit, runtime + dev)
        run: pip-audit -r requirements-dev.txt
      - name: Pytest
        run: pytest -q
      - name: Tests on SQLCipher
        run: TEST_DB_KEY="$(python -c 'print("ab" * 32)')" pytest -q

  frontends:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        app: [pwa, tma]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Forbidden words and unsafe APIs
        run: |
          ! grep -rniE '\bVPN\b|обход|анонимн|proxy' src --include='*.ts' --include='*.tsx'
          ! grep -rn 'dangerouslySetInnerHTML' src

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [python, frontends]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build bot image
        run: docker build --target bot -t node-rental-bot:ci .
      - name: Build web image
        run: docker build --target web --build-arg VITE_BOT_USERNAME=ci_test_bot -t node-rental-web:ci .
