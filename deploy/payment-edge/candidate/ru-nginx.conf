# RU: loopback-only; Cloudflare Tunnel forwards here.
limit_req_zone $server_name zone=node_payment_notifications:1m rate=100r/s;
server {
    listen 127.0.0.1:18080;
    server_name pay.cyberdefency.com;
    client_max_body_size 64k;
    client_body_buffer_size 64k;
    client_body_timeout 10s;
    access_log off;
    error_log /dev/null crit;
    server_tokens off;

    location = /yookassa/webhook {
        limit_req zone=node_payment_notifications burst=200 nodelay;
        limit_req_status 429;
        limit_except POST { deny all; }
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host payment-backend;
        proxy_set_header Content-Type application/json;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_send_timeout 20s;
        proxy_read_timeout 25s;
        proxy_next_upstream off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;

        proxy_pass http://10.203.0.2:18081;
    }
    location / { return 404; }
}
