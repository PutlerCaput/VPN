# Kernel network hardening for the RU VPN-entry server.
# Install: copy to /etc/sysctl.d/99-ru-hardening.conf and run `sysctl --system`.
# Safe for the DNAT/forward box: ip_forward stays on and rp_filter is "loose" (2)
# so the forwarded VPN return path is never dropped. It touches no firewall rule.

# Keep forwarding on — the VPN entry (DNAT 443/2087/8443 -> DE:2096) needs it.
net.ipv4.ip_forward = 1

# SYN-flood resistance (the cheap, proven half of "DDoS protection" on one host).
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_rfc1337 = 1

# Loose reverse-path filtering: drops spoofed sources without breaking DNAT return.
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# Ignore redirects and source routing — classic spoofing/MITM vectors.
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0

# Ignore broadcast pings and bogus ICMP errors (smurf-style amplification).
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
