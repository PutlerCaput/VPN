# Kernel network hardening for the RU VPN-entry server (IPv4 only; RU has no IPv6).
# Install: /etc/sysctl.d/99-ru-hardening.conf, then `sysctl --system`.
# Touches no firewall rule. Forwarding stays on and rp_filter is "loose" (2), so the
# DNAT return path of the VPN entry is never dropped.

net.ipv4.ip_forward = 1

# SYN-flood resistance
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_rfc1337 = 1

# Loose reverse-path filter: drops spoofed sources without breaking DNAT return
net.ipv4.conf.all.rp_filter = 2
net.ipv4.conf.default.rp_filter = 2

# No redirects or source routing (spoofing / MITM vectors)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0

# Ignore broadcast pings and bogus ICMP errors (smurf-style amplification)
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1
