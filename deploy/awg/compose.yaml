# Subscriber AmneziaWG instance. Started by scripts/install_awg.sh, which
# writes .env (AWG_PORT, AWG_ENDPOINT_HOST, BOT_NETWORK) and the token secret.
name: cyberdefency-awg

services:
  awg:
    build: .
    image: cyberdefency-awg:latest
    container_name: cyberdefency-awg
    restart: unless-stopped
    # An oversized DNS zone restarts only this container, not the whole host.
    mem_limit: 768m
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    environment:
      AWG_PORT: ${AWG_PORT:-39051}
      AWG_SUBNET: ${AWG_SUBNET:-10.67.0.0/24}
      AWG_ENDPOINT_HOST: ${AWG_ENDPOINT_HOST:?set AWG_ENDPOINT_HOST}
      # 1 = clients use the server's filtering resolver (malware, phishing, adult,
      # gambling blocked). Only used when the resolver is available.
      AWG_DNS_FILTER: ${AWG_DNS_FILTER:-1}
      AWG_DNS: ${AWG_DNS:-1.1.1.1, 1.0.0.1}
    ports:
      - "${AWG_PORT:-39051}:${AWG_PORT:-39051}/udp"
    volumes:
      - awg_state:/var/lib/awg
    secrets:
      - awg_agent_token
    networks:
      - egress
      - bot
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  # Internet access for the tunnel; the agent NATs via the default route.
  egress: {}
  # The bot's existing network: the bot reaches http://cyberdefency-awg:8090.
  bot:
    external: true
    name: ${BOT_NETWORK:?set BOT_NETWORK}

secrets:
  awg_agent_token:
    file: ./secrets/awg_agent_token.txt

volumes:
  awg_state:
