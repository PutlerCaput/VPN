# Independent web-only stack for the DE server that already runs Hiddify Manager Caddy.
# The live bot and Hiddify Manager stack are not members of this Compose project.
name: node-rental-web-local

services:
  app-web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to the tested immutable release tag or digest}
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 256m
    cpus: "1.0"
    environment:
      # The web image uses the same Caddyfile and static assets as the main stack.
      DOMAIN: http://:18082
      CADDY_BIND: 127.0.0.1
      BOT_UPSTREAM: 127.0.0.1:8080
      CADDY_ADMIN: "off"
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL to the owner's certificate contact email}
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /data:size=16m,uid=1000,gid=1000,mode=0700
      - /config:size=16m,uid=1000,gid=1000,mode=0700
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    healthcheck:
      test: [CMD, wget, -Y, "off", -q, -O, /dev/null, "http://127.0.0.1:18082/oferta"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
